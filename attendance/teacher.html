<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>NK EduTrack · ครู</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="manifest" href="manifest-teacher.webmanifest">
<meta name="theme-color" content="#3056d3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NK ครู">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><img class="logo" src="img/logo.webp" alt="" width="36" height="36"><span>NK EduTrack · ครู</span></a>
    <button class="btn sm hidden" id="install-app" type="button">📲 ติดตั้งแอป</button>
    <button class="btn sm hidden" id="logout" type="button">ออกจากระบบ</button>
  </div>
</header>

<main>
  <section id="view-login" class="narrow hidden">
    <div class="card">
      <h1>เข้าสู่ระบบครู</h1>
      <form id="login-form">
        <label class="field">รหัสผ่านครู
          <input id="pass" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary block" type="submit">เข้าสู่ระบบ</button>
      </form>
    </div>
  </section>

  <section id="view-app" class="wrap hidden">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="timetable" aria-selected="true">ตารางสอน · สร้าง QR</button>
      <button class="tab" role="tab" data-tab="checkin" aria-selected="false">เช็กชื่อสด</button>
      <button class="tab" role="tab" data-tab="assign" aria-selected="false">มอบหมายงาน</button>
      <button class="tab" role="tab" data-tab="review" aria-selected="false">ตรวจงาน</button>
      <button class="tab" role="tab" data-tab="report" aria-selected="false">คะแนนและรายงาน</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">นักเรียนและตั้งค่า</button>
    </div>
    <div id="p-timetable" role="tabpanel"></div>
    <div id="p-checkin" role="tabpanel" class="hidden"></div>
    <div id="p-assign" role="tabpanel" class="hidden"></div>
    <div id="p-review" role="tabpanel" class="hidden"></div>
    <div id="p-report" role="tabpanel" class="hidden"></div>
    <div id="p-settings" role="tabpanel" class="hidden"></div>
  </section>
</main>
<div id="modal-root"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="receipt.js"></script>
<script src="teacher.js"></script>
</body>
</html>
