<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>NK EduTrack · ครู</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="manifest" href="manifest-teacher.webmanifest">
<meta name="theme-color" content="#3056d3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NK ครู">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=20261101e">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><img class="logo" src="img/logo.webp" alt="" width="40" height="40"><span class="bt"><b>NK EduTrack</b><small>ระบบสำหรับครู · โรงเรียนมัธยมวัดหนองแขม</small></span></a>
    <button class="btn sm hidden" id="install-app" type="button" aria-label="ติดตั้งแอป"><i data-ic="phone"></i><span class="lbl">ติดตั้งแอป</span></button>
    <button class="btn sm hidden" id="logout" type="button" aria-label="ออกจากระบบ"><i data-ic="logout"></i><span class="lbl">ออกจากระบบ</span></button>
  </div>
</header>

<main>
  <section id="view-login" class="narrow hidden">
    <div class="card">
      <div class="pagehead" style="margin-bottom:12px"><span class="tile"><i data-ic="lock"></i></span><div><h1 style="margin:0">เข้าสู่ระบบครู</h1><div class="small muted">ใส่รหัสผ่านเพื่อจัดการคาบเรียนและงาน</div></div></div>
      <form id="login-form">
        <label class="field">รหัสผ่านครู
          <input id="pass" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary block" type="submit"><i data-ic="logout"></i>เข้าสู่ระบบ</button>
      </form>
    </div>
  </section>

  <section id="view-app" class="wrap hidden">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="timetable" aria-selected="true" title="ตารางสอนและสร้าง QR"><i data-ic="calendar"></i><span>ตารางสอน</span></button>
      <button class="tab" role="tab" data-tab="checkin" aria-selected="false" title="เช็กชื่อสด"><i data-ic="userCheck"></i><span>เช็กชื่อสด</span></button>
      <button class="tab" role="tab" data-tab="assign" aria-selected="false" title="มอบหมายงาน"><i data-ic="assign"></i><span>มอบหมาย</span></button>
      <button class="tab" role="tab" data-tab="review" aria-selected="false" title="ตรวจงาน"><i data-ic="review"></i><span>ตรวจงาน</span></button>
      <button class="tab" role="tab" data-tab="report" aria-selected="false" title="คะแนนและรายงาน"><i data-ic="chart"></i><span>คะแนน</span></button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false" title="นักเรียนและตั้งค่า"><i data-ic="settings"></i><span>ตั้งค่า</span></button>
    </div>
    <div id="p-timetable" role="tabpanel"></div>
    <div id="p-checkin" role="tabpanel" class="hidden"></div>
    <div id="p-assign" role="tabpanel" class="hidden"></div>
    <div id="p-review" role="tabpanel" class="hidden"></div>
    <div id="p-report" role="tabpanel" class="hidden"></div>
    <div id="p-settings" role="tabpanel" class="hidden"></div>
  </section>
</main>
<div id="modal-root"></div>

<script src="config.js?v=20261101e"></script>
<script src="common.js?v=20261101e"></script>
<script src="vendor/qrcode.min.js?v=20261101e"></script>
<script src="receipt.js?v=20261101e"></script>
<script src="teacher.js?v=20261101e"></script>
</body>
</html>
